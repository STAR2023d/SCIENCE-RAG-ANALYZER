[project]
name = "first-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dan kamau mawaura", email = "mwauradan37@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "inngest>=0.5.19",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.19.2",
