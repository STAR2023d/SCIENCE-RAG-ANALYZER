[project]
name = "science-rag-analyzer"
version = "0.2.0"
description = "Multimodal RAG system: ask questions about science notes and get answers with the matching figures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "inngest>=0.5.19",
    "llama-index-readers-file>=0.5",
    "openai>=1.50",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
    "requests>=2.31",
    "streamlit>=1.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "reportlab>=4.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "science_rag"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
